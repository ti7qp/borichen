name: Run Android Emulator with UI
on: 
  workflow_dispatch:

jobs:
  run-emulator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Enable KVM (تسريع الهاردوير)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Desktop & VNC (تثبيت واجهة وشاشة وهمية)
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y xfce4 xvfb x11vnc dbus-x11

      - name: Setup Tailscale (تجهيز الاتصال الآمن)
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: Install System Image and Patch with Magisk (تثبيت وتفليش Magisk)
        run: |
          # تثبيت صورة النظام (Android 11 - API 30 لدعم برامج ARM)
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install "system-images;android-30;google_apis;x86_64"
          
          # تحميل وتفليش الروت (قبل ما المحاكي يشتغل عشان نتجنب مشكلة الـ Multiple Emulators)
          git clone https://github.com/newbit1/rootAVD.git
          cd rootAVD
          export ANDROID_HOME=/usr/local/lib/android/sdk
          echo "⏳ جاري تفليش Magisk في النظام..."
          ./rootAVD.sh system-images/android-30/google_apis/x86_64/ramdisk.img || true
          echo "✅ تم تفليش Magisk والصورة جاهزة للإقلاع!"

      - name: Start Screen and VNC Server
        run: |
          Xvfb :0 -screen 0 1920x1080x24 &
          sleep 2
          DISPLAY=:0 xfce4-session &
          x11vnc -display :0 -nopw -xkb -ncache 10 -ncache_cr -forever &
          
          TS_IP=$(tailscale ip -4)
          echo "=========================================================="
          echo "✅ الاتصال جاهز عبر Tailscale!"
          echo "انسخ هذا الـ IP وضعه في برنامج VNC Viewer للاتصال:"
          echo "👉  $TS_IP  👈"
          echo "=========================================================="

      - name: Create Emulator Script
        run: |
          cat > $GITHUB_WORKSPACE/run_emulator.sh << 'EOF'
          #!/bin/bash
          echo "⏳ جاري تجهيز إعدادات الروت و LSPosed..."
          
          # تثبيت تطبيق Magisk (لأن التفليش حصل والمحاكي مقفول)
          /usr/local/lib/android/sdk/platform-tools/adb install ~/work/android-emulator-runner/android-emulator-runner/rootAVD/Apps/Magisk.apk || true
          
          # ==========================================
          # 3. المرحلة الثالثة: إعطاء الصلاحيات تلقائياً وتفعيل Zygisk
          # ==========================================
          # تفعيل الروت لـ ADB نفسه
          /usr/local/lib/android/sdk/platform-tools/adb root
          sleep 3
          
          # إعطاء الروت لأي تطبيق أوتوماتيك (بدون سؤال)
          /usr/local/lib/android/sdk/platform-tools/adb shell "magisk --sqlite \"REPLACE INTO settings (key, value) VALUES ('su_auto_response', 2);\""
          
          # تفعيل خاصية Zygisk (الضرورية لبرنامج LSPosed)
          /usr/local/lib/android/sdk/platform-tools/adb shell "magisk --sqlite \"REPLACE INTO settings (key, value) VALUES ('zygisk', 1);\""
          
          # ==========================================
          # 4. المرحلة الرابعة: تخطي رسالة "Additional Setup" برمجياً
          # ==========================================
          /usr/local/lib/android/sdk/platform-tools/adb shell monkey -p com.topjohnwu.magisk -c android.intent.category.LAUNCHER 1
          sleep 5
          /usr/local/lib/android/sdk/platform-tools/adb shell input keyevent 22
          /usr/local/lib/android/sdk/platform-tools/adb shell input keyevent 66
          
          # ننتظر المحاكي يعمل ريستارت ويفتح تاني بعد التهيئة
          /usr/local/lib/android/sdk/platform-tools/adb wait-for-device
          sleep 30
          
          # ==========================================
          # 5. المرحلة الخامسة: تحميل وتثبيت LSPosed
          # ==========================================
          wget https://github.com/LSPosed/LSPosed/releases/download/v1.9.2/LSPosed-v1.9.2-7024-zygisk-release.zip -O lsposed.zip
          /usr/local/lib/android/sdk/platform-tools/adb push lsposed.zip /data/local/tmp/
          /usr/local/lib/android/sdk/platform-tools/adb shell su -c "magisk --install-module /data/local/tmp/lsposed.zip"
          
          # ==========================================
          # 6. المرحلة الأخيرة: الريستارت النهائي والتنظيف
          # ==========================================
          /usr/local/lib/android/sdk/platform-tools/adb reboot
          /usr/local/lib/android/sdk/platform-tools/adb wait-for-device
          sleep 30
          
          rm lsposed.zip
          /usr/local/lib/android/sdk/platform-tools/adb shell rm /data/local/tmp/lsposed.zip
          
          echo "=========================================================="
          echo "✅ تم بنجاح! الروت يعمل، الصلاحيات تلقائية، و LSPosed مفعل."
          echo "✅ المحاكي جاهز! يمكنك الدخول عبر VNC"
          echo "=========================================================="
          sleep 21600
          EOF
          chmod +x $GITHUB_WORKSPACE/run_emulator.sh

      - name: Start Android Emulator with Root
        uses: reactivecircus/android-emulator-runner@v2
        env:
          DISPLAY: :0
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            bash $GITHUB_WORKSPACE/run_emulator.sh
