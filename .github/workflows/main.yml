name: Run Android Emulator (SNAPSHOT FAST BOOT)
on: 
  workflow_dispatch:

jobs:
  run-emulator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Load .env variables
        run: |
          if [ -f .env ]; then
            cat .env >> $GITHUB_ENV
            echo "✅ تم تحميل المتغيرات من ملف .env"
          else
            echo "⚠️ ملف .env غير موجود! يرجى التأكد من رفعه."
          fi

      - name: Enable KVM (تسريع الهاردوير)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Desktop & VNC (تثبيت واجهة وشاشة وهمية)
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y xfce4 xvfb x11vnc dbus-x11

      - name: Setup Tailscale (تجهيز الاتصال الآمن)
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: Install System Image
        run: |
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install "system-images;android-29;google_apis;x86_64"

      - name: Download and Restore Full AVD Snapshot (تحميل النسخة الاحتياطية)
        run: |
          # تجهيز مسار المحاكي
          mkdir -p ~/.android/avd/test.avd
          
          # إنشاء ملف test.ini عشان النظام يتعرف على المحاكي
          cat > ~/.android/avd/test.ini << 'EOF'
          avd.ini.encoding=UTF-8
          path=/home/runner/.android/avd/test.avd
          path.rel=avd/test.avd
          target=android-29
          EOF
          
          echo "⬇️ جاري تحميل Snapshot من الرابط..."
          wget -q "${{ secrets.SNAPSHOT }}" -O /tmp/snapshot.tar.gz
          
          echo "📦 جاري فك الضغط لاستعادة المحاكي بالكامل..."
          tar -xzvf /tmp/snapshot.tar.gz -C ~/.android/avd/test.avd/
          
          # استعادة الروت (ramdisk) لو موجود
          if [ -f ~/.android/avd/test.avd/patched_ramdisk.img ]; then
            echo "🔄 تم العثور على patched_ramdisk.img، جاري استعادته لملفات النظام الأساسية..."
            cp ~/.android/avd/test.avd/patched_ramdisk.img /usr/local/lib/android/sdk/system-images/android-29/google_apis/x86_64/ramdisk.img
          else
            echo "⚠️ تنبيه: ملف patched_ramdisk.img غير موجود! قد تفقد الروت."
          fi
          
          # استخراج اسم الـ Snapshot تلقائياً
          if [ -d ~/.android/avd/test.avd/snapshots ]; then
            SNAP_NAME=$(ls ~/.android/avd/test.avd/snapshots/ | grep -v 'default_boot' | head -1)
            echo "SNAPSHOT_NAME=$SNAP_NAME" >> $GITHUB_ENV
            echo "✅ تم العثور على Snapshot: $SNAP_NAME"
          else
            echo "⚠️ تنبيه: مجلد snapshots غير موجود! ربما الملف المضغوط لا يحتوي عليه."
          fi

      - name: Start Screen and VNC Server
        run: |
          Xvfb :0 -screen 0 1920x1080x24 &
          sleep 2
          DISPLAY=:0 xfce4-session &
          x11vnc -display :0 -nopw -xkb -ncache 10 -ncache_cr -forever &
          
          TS_IP=$(tailscale ip -4)
          echo "=========================================================="
          echo "✅ الاتصال جاهز عبر Tailscale!"
          echo "انسخ هذا الـ IP وضعه في برنامج VNC Viewer للاتصال:"
          echo "👉  $TS_IP  👈"
          echo "=========================================================="

      - name: Run Emulator from Snapshot
        run: |
          echo "🚀 جاري تشغيل المحاكي..."
          if [ -n "$SNAPSHOT_NAME" ]; then
            echo "يتم الإقلاع باستخدام Snapshot: $SNAPSHOT_NAME"
            DISPLAY=:0 /usr/local/lib/android/sdk/emulator/emulator -avd test -gpu swiftshader_indirect -noaudio -no-boot-anim -snapshot $SNAPSHOT_NAME &
          else
            DISPLAY=:0 /usr/local/lib/android/sdk/emulator/emulator -avd test -gpu swiftshader_indirect -noaudio -no-boot-anim &
          fi
          
          # ننتظر لحد ما يفتح
          /usr/local/lib/android/sdk/platform-tools/adb wait-for-device
          
          echo "=========================================================="
          echo "✅ المحاكي جاهز! تم تحميل الـ SNAPSHOT بنجاح"
          echo "=========================================================="
          sleep 21600
